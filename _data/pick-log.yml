    평균 뒤에 숨기지 않고 내놓고, 정확도 회복의 핵심이 코드북이 아니라
    per-block absmax 스케일 입자라고 보고한다 — Q9 질문 2(붕괴 원인)의
    ETH 활성 스케일 입자 가설과 KV 쪽에서 독립적으로 만나는 자리.
  switch_notice: false
  note: >
    (a) 픽 — 08-29 글 편집자 메모 상자("반복되는 상태를 저비트로 유지할 때
    무엇이 무너지나")에서 Nemotron(08-31) 다음 순번. blog_pick_queue.py
    (b) 대기열 2순위와도 겹침. 최신 3편의 명시적 다음 후보(ACBench·SlimMoE·
    SliceGPT·ETH 2607.16237)는 전부 미러 미도착 — 08-29 상자 #4가 도착한
    유일 후보. 곁가지: 2606.26861 (On-Device Cascaded Pruning·SIA, 초록
    수준) — Q9 질문 3(레이블 없이 손상 사전 예측)에 닿음. 두 탐구 dossier가
    2504.04823("Quantization Hurts Reasoning?")을 공통 1순위 인용(겹침도
    ~10%). ETH 병렬 연구가 동향 dossier에서 초록 verbatim으로 잡혀 Q9
    질문 2의 요약 수준 대조 가능해짐.

