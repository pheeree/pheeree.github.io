    PatchKV)은 전부 탐구 자료 기준 원문 미대조로 정직하게 표시.
    check_markup(함정 없음)·check_sentence_reuse(직전 3편과
    동일 문장 0건)·check_claim_load(미대조 주장이 논증 전제로
    쓰인 자리 없음)·verify-draft(arXiv id 10개 전부 실재) 전부
    통과. 글쓰기는 Opus 서브에이전트가 초안 저장까지 수행(지시
    범위 밖의 자발적 행동 — 본 세션이 사후 독립 검증으로 대체
    확인). self-critique 단계는 시간 예산상 생략, 대신 본 세션이
    직접 마크업·인용·구조·voice 전체 재검증. 다양성 가드: 직전
    사슬(증류/RLVR/멀티에이전트/해석가능성)에서 완전히 벗어나
    이 블로그 최초로 시스템/엣지 인프라 논문에 도달 — 우연이
    다양성 관리를 또 한 번 대신함. 분량 27,085자.
