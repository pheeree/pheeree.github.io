<!-- 본문 한글 폰트 — Noto Serif KR / 본명조 (Google Fonts, 유니코드 서브셋, font-display:swap) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- Mermaid 다이어그램 지원 — ```mermaid 코드블록을 자동 렌더 -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  window.addEventListener('load', () => {
    document.querySelectorAll('pre > code.language-mermaid').forEach((el) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.parentElement.replaceWith(div);
    });
    mermaid.run();
  });
</script>
<style>
  .mermaid { text-align: center; margin: 1.5em 0; overflow-x: auto; }
  .mermaid svg { max-width: 100%; height: auto; }
</style>

<!-- MathJax 수식 지원 — 인라인 $...$, 디스플레이 $$...$$ 또는 \[...\] -->
<!-- kramdown이 \(...\)를 escape하므로 $...$를 쓴다. kramdown은 $$...$$를 \[...\]로 변환하므로 양쪽 등록. -->
<!-- 통화 표기는 본문에서 \$로 이스케이프. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

<!-- 인용 사이드노트 — kramdown 풋노트를 넓은 화면(≥1080px)에서 우측 마진으로 배치 -->
<!-- 좁은 화면에선 아무것도 안 하고 kramdown 기본 하단 미주로 둔다 -->
<script>
  (function () {
    var MQ = window.matchMedia('(min-width: 1080px)');
    function clear(post) {
      post.querySelectorAll('.sidenote').forEach(function (s) { s.remove(); });
      post.classList.remove('has-sidenotes');
    }
    function layout() {
      document.querySelectorAll('article.post, .post').forEach(function (post) {
        clear(post);
        var fnotes = post.querySelector('.footnotes');
        if (!fnotes || !MQ.matches) return;
        var items = fnotes.querySelectorAll(':scope > ol > li');
        if (!items.length) return;
        post.classList.add('has-sidenotes');
        var postTop = post.getBoundingClientRect().top + window.scrollY;
        var prevBottom = 0;
        items.forEach(function (li) {
          var key = (li.id.split(':')[1]) || '';        // fn:p1 → 키 "p1"
          var ref = post.querySelector('[id="fnref:' + key + '"]');
          if (!ref) return;
          // 표시 번호는 본문 마커의 텍스트(1,2,3…)를 쓴다. 명명 풋노트라도 화면엔 일련번호가 찍힌다.
          var label = (ref.textContent || '').trim() || key;
          var aside = document.createElement('aside');
          aside.className = 'sidenote';
          var body = li.cloneNode(true);
          var back = body.querySelector('.reversefootnote');
          if (back) back.remove();
          aside.innerHTML = '<span class="sn-num">' + label + '</span>' + body.innerHTML;
          post.appendChild(aside);
          var top = ref.getBoundingClientRect().top + window.scrollY - postTop;
          if (top < prevBottom + 12) top = prevBottom + 12;  // 겹치면 아래로
          aside.style.top = top + 'px';
          prevBottom = top + aside.offsetHeight;
        });
      });
    }
    var t;
    function schedule() { clearTimeout(t); t = setTimeout(layout, 120); }
    window.addEventListener('load', function () { layout(); setTimeout(layout, 800); });
    window.addEventListener('resize', schedule);
    if (MQ.addEventListener) MQ.addEventListener('change', layout);
  })();
</script>
