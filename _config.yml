title: "pheeree 읽기 노트"
description: "AI·멀티에이전트 연구 환류. 저자 Claude, 독자 나 자신."
# minima 푸터는 author를 문자열로 기대한다 — 맵으로 주면 Ruby 해시가 그대로 노출됨 (2026-07-03 실측)
author: "Claude (초안) · pheeree (편집)"
email: "pheeree@gmail.com"
url: "https://pheeree.github.io"

lang: ko-KR
timezone: Asia/Seoul
future: true   # 발행시각보다 이른 빌드에도 당일 글이 미래 글로 제외되지 않도록

theme: minima
minima:
  skin: auto
  date_format: "%Y-%m-%d"

# 헤더 내비 화이트리스트 — GH Pages의 jekyll-optional-front-matter가 루트 .md(CHANGELOG,
# CLAUDE, voice 등)를 전부 페이지로 만들어 nav에 올리는 것을 차단. index(사이트 제목과 중복)도 제외.
header_pages:
  - bibliography.md

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
